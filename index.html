<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<style id="app-lock">html{-webkit-text-size-adjust:100%;text-size-adjust:100%}:where(html,body,*){touch-action:manipulation}</style>
<script id="app-lock-js">(function(){var s={passive:false},p=function(e){e.preventDefault()};
['gesturestart','gesturechange','gestureend'].forEach(function(t){document.addEventListener(t,p,s)});
document.addEventListener('touchmove',function(e){if(e.touches&&e.touches.length>1)e.preventDefault()},s);
document.addEventListener('dblclick',p,s);
addEventListener('wheel',function(e){if(e.ctrlKey)e.preventDefault()},s);
addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&/^[=+\-0]$/.test(e.key))e.preventDefault()});})();</script>


<title>運動進度紀錄表</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@500;700;900&display=swap">
<style>
:root{
  --ink:#3a2a35; --muted:#9a7f8c; --line:#ffd6e4;
  --red:#e5252a; --red-d:#a6121a; --pink:#ff5c93; --pink-l:#ffe3ee; --pink-b:#ffb3cf;
  --blue:#2aa3f5; --green:#2ecc71; --yellow:#f6c62b; --orange:#ffa51f;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;color:var(--ink);font-family:"Chiron GoRound TC","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;font-weight:700}
body{
  min-height:100vh;
  background:
    radial-gradient(circle at 0% 0%,#bfe6ff 0,transparent 42%),
    radial-gradient(circle at 100% 0%,#ffd0e4 0,transparent 40%),
    radial-gradient(circle at 100% 100%,#fff0a8 0,transparent 42%),
    radial-gradient(circle at 0% 100%,#d6f5c6 0,transparent 38%),
    #fff7f2;
  background-attachment:fixed;
}
.app{max-width:560px;margin:0 auto;padding:18px 14px 40px;position:relative}
.deco{position:absolute;pointer-events:none;font-size:22px;animation:fl 3s ease-in-out infinite;z-index:2}
.d1{top:2px;left:4px}.d2{top:92px;right:2px;animation-delay:.7s}.d3{top:150px;left:-2px;font-size:18px;animation-delay:1.2s}.d4{bottom:100px;right:4px;font-size:20px;animation-delay:.4s}
@keyframes fl{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-6px) rotate(8deg)}}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
h1{margin:0;font-size:29px;font-weight:900;letter-spacing:1px;line-height:1.1;
  filter:drop-shadow(2px 0 0 #3a2a35) drop-shadow(-2px 0 0 #3a2a35) drop-shadow(0 2px 0 #3a2a35) drop-shadow(0 -2px 0 #3a2a35) drop-shadow(0 4px 3px rgba(60,30,50,.3))}
h1 span{color:var(--c);-webkit-text-stroke:7px #fff;paint-order:stroke fill;text-shadow:0 0 0 #fff}

/* 3D buttons */
.btn{
  --c1:#ff5a5f;--c2:var(--red);--sh:var(--red-d);
  appearance:none;border:0;cursor:pointer;color:#fff;font-weight:900;font-size:16px;letter-spacing:1px;
  padding:12px 18px;border-radius:18px;
  background:linear-gradient(180deg,var(--c1),var(--c2));
  box-shadow:0 5px 0 var(--sh),0 9px 14px rgba(120,40,80,.22),inset 0 2px 0 rgba(255,255,255,.55);
  transition:transform .08s,box-shadow .08s;position:relative;font-family:inherit;
}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--sh),0 3px 5px rgba(120,40,80,.2),inset 0 2px 0 rgba(255,255,255,.4)}
.btn.red{--c1:#ff4d52;--c2:#e5252a;--sh:#a6121a}
.btn.gray{--c1:#a3a8b4;--c2:#80858f;--sh:#5a5f6b}
.btn.blue{--c1:#6cc8ff;--c2:#2aa3f5;--sh:#1676b8}
.btn.orange{--c1:#ffd061;--c2:#ffa51f;--sh:#c97700}
.btn.green{--c1:#47dd88;--c2:#22b862;--sh:#13803f}
.btn.light{--c1:#ffffff;--c2:#ffe3ee;--sh:#f0a3c1;color:var(--ink)}
.btn.sm{font-size:14px;padding:9px 14px;border-radius:15px}
.btn.xs{font-size:14px;padding:7px 12px;border-radius:13px;box-shadow:0 4px 0 var(--sh),0 6px 10px rgba(120,40,80,.18),inset 0 2px 0 rgba(255,255,255,.55)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.chip{--c1:#ffeef5;--c2:#ffc9dc;--sh:#ee95b6;color:#b0305f}
.btn.chip.on{--c1:#ff4d52;--c2:#e5252a;--sh:#a6121a;color:#fff}

/* month bar */
.monthbar{display:grid;grid-template-columns:56px 1fr 56px;gap:10px;align-items:center;margin:6px 0 2px}
.ym{
  text-align:center;font-size:24px;font-weight:900;padding:9px 6px;border-radius:999px;cursor:pointer;user-select:none;
  background:var(--pink-l);border:3px solid #ff8fb5;color:var(--ink);box-shadow:0 4px 0 var(--pink-b),inset 0 2px 0 #fff;
}
.hint{text-align:center;color:#8a6a00;font-size:12.5px;margin:12px auto 12px;padding:7px 12px;border-radius:18px;background:#fff6c4;border:2.5px dashed #ffd24d;max-width:fit-content}

/* calendar */
.cal{position:relative;background:rgba(255,255,255,.94);border:3.5px dashed var(--pink-b);border-radius:28px;padding:12px;box-shadow:0 0 0 6px rgba(255,255,255,.65),0 12px 24px rgba(200,80,130,.15)}
.wk,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.wk div{text-align:center;font-size:14px;font-weight:900;color:#b58a9d;padding:6px 0}
.wk div:first-child,.wk div:last-child{color:var(--pink)}
.cell{
  min-height:62px;border-radius:14px;padding:5px 4px;cursor:pointer;position:relative;
  background:linear-gradient(180deg,#fff,#fff0f6);border:2px solid #ffd6e4;box-shadow:0 3px 0 #ffc2d8;
  display:flex;flex-direction:column;align-items:center;gap:3px;transition:transform .08s,box-shadow .08s;
}
.cell:active{transform:translateY(2px);box-shadow:0 1px 0 #ffc2d8}
.cell.empty{background:none;border:0;box-shadow:none;cursor:default}
.cell .n{font-size:15px;font-weight:900}
.cell.today{background:linear-gradient(180deg,#fff9d2,#ffec8a);border-color:#ffc233;box-shadow:0 3px 0 #e8a800}
.cell.today .n{color:#e8590c}
.cell.today::after{content:"⭐";position:absolute;top:-9px;right:-6px;font-size:14px}
.cell.past .n{color:#b8a3ad}
.dots{display:flex;flex-wrap:wrap;justify-content:center;gap:3px;max-width:100%}
.dot{width:10px;height:10px;border-radius:50%;border:1.5px solid #d5a9bb;background:#fff;font-size:8px;line-height:7px;text-align:center}
.dot.s1{background:var(--green);border-color:#1ea455}
.dot.s2{background:var(--yellow);border-color:#c99b0a}
.dot.s3{border:0;background:none;font-size:11px;line-height:10px;width:11px;height:11px}
.more{font-size:10px;color:var(--muted)}

/* actions */
.actions{display:grid;grid-template-columns:3fr 7fr;gap:12px;margin-top:22px}
.actions .btn{height:60px;font-size:18px;padding:0;border-radius:20px}
.notifybar{text-align:center;margin-top:20px}
.notifybar .sub{display:inline-block;background:#fff6c4;border:2.5px dashed #ffd24d;border-radius:16px;padding:6px 12px;color:#8a6a00}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(90,40,70,.45);display:flex;align-items:center;justify-content:center;padding:14px;z-index:50;animation:fade .15s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:#fffafc;border:3.5px dashed var(--pink-b);border-radius:28px;width:100%;max-width:480px;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 0 0 6px rgba(255,255,255,.8),0 18px 50px rgba(120,30,70,.35);overflow:hidden}
.mh{padding:16px 18px 10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.mh h2{font-size:19px;margin:0;font-weight:900;color:#e0306f}
.mb{padding:4px 18px 14px;overflow:auto;flex:1}
.mf{padding:12px 18px 18px;display:flex;gap:10px;justify-content:flex-end;border-top:2.5px dashed var(--pink-b)}
.sub{color:var(--muted);font-size:13px;font-weight:700}
.tag{display:inline-block;font-size:12px;padding:2px 9px;border-radius:99px;background:#fff6c4;color:#c67a00;border:2px solid #ffd24d;margin-left:6px;font-weight:900}
.tag.lock{background:#f3eef0;color:#8a7a82;border-color:#d9ccd2}

/* day events */
.ev{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:2.5px dashed #ffd6e4}
.ev:last-child{border-bottom:0}
.box{
  flex:none;width:36px;height:36px;border-radius:12px;border:3px solid #ff9fc0;background:#fff;cursor:pointer;
  font-size:20px;line-height:1;display:flex;align-items:center;justify-content:center;padding:0;
  box-shadow:0 3px 0 #ffc2d8;transition:transform .08s,box-shadow .08s;
}
.box:active:not(.locked){transform:translateY(2px);box-shadow:0 1px 0 #ffc2d8}
.box.s1{background:var(--green);border-color:#1ea455;box-shadow:0 3px 0 #13803f}
.box.s2{background:var(--yellow);border-color:#c99b0a;box-shadow:0 3px 0 #9a7506}
.box.s3{background:#fff;border-color:#e5252a}
.box.locked{cursor:not-allowed;box-shadow:none}
.evname{font-size:17px;font-weight:900;padding-top:4px}
.evmain{flex:1;min-width:0}
.note{width:100%;margin-top:6px;padding:9px 11px;border:2.5px solid #ffc933;border-radius:14px;font-size:15px;background:#fffbe3;font-family:inherit;font-weight:700;color:var(--ink)}
.notetxt{margin-top:4px;font-size:14px;color:#8a6a00;background:#fffbe3;border-radius:10px;padding:6px 9px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:2px 0 8px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;border:1.5px solid #ff9fc0;vertical-align:-2px;margin-right:4px;font-style:normal;font-size:10px;line-height:9px;text-align:center}

/* forms */
label.f{display:block;font-weight:900;margin:14px 0 6px;font-size:15px;color:#c42a63}
input[type=text],input[type=date]{width:100%;padding:11px 12px;border:3px solid #ffc2d8;border-radius:16px;font-size:16px;font-family:inherit;font-weight:700;background:#fff;color:var(--ink)}
input:focus{outline:none;border-color:var(--blue)}
.chips{display:flex;flex-wrap:wrap;gap:10px 8px}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.row2>div{min-width:0}
.row2 small{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
input[type=date]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;height:auto;line-height:1.4;color:var(--ink);-webkit-text-fill-color:var(--ink);text-align:center;font-size:15px;padding:12px 6px}
input[type=date]::-webkit-date-and-time-value{text-align:center;margin:0 auto;min-height:1.4em;line-height:1.4}
input[type=date]::-webkit-datetime-edit{padding:0;text-align:center}
.chips2{display:grid;grid-template-columns:1fr 1fr;gap:12px 10px}
.chips2 .btn{width:100%;padding-left:6px;padding-right:6px;white-space:nowrap}
.err{color:var(--red);font-size:13px;min-height:18px;margin-top:8px}

/* preview calendar */
.pv{margin-top:12px;border:3px dashed #ffc2d8;border-radius:20px;padding:10px;background:#fff}
.pvh{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;font-weight:900}
.pvg{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.pvg .h{font-size:12px;color:var(--muted);padding:3px 0}
.pvg .d{padding:7px 0;border-radius:10px;font-size:14px;background:#fff0f6;color:#6b5560}
.pvg .d.hit{background:linear-gradient(180deg,#ff5359,#e5252a);color:#fff;font-weight:900;box-shadow:0 2px 0 #a6121a}
.pvg .d.x{background:none}
.pvg .d.off{opacity:.45}

/* delete list */
.dg{font-weight:900;margin:12px 0 4px;font-size:15px;color:var(--blue)}
.di{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:16px;background:#fff0f6;border:2px solid #ffd6e4;margin-bottom:6px;cursor:pointer}
.di input{width:20px;height:20px;accent-color:var(--red)}
.di .st{margin-left:auto;font-size:12px;color:var(--muted)}

/* wheel */
.wheels{display:grid;grid-template-columns:1.3fr 1fr;gap:12px;position:relative}
.wheel{height:216px;overflow-y:auto;scroll-snap-type:y mandatory;padding:90px 0;scrollbar-width:none;background:#fff0f6;border-radius:18px;border:2.5px solid #ffd6e4}
.wheel::-webkit-scrollbar{display:none}
.wheel div{height:36px;line-height:36px;text-align:center;scroll-snap-align:center;font-size:20px;color:#c9a9b8;cursor:pointer;transition:all .1s}
.wheel div.sel{color:var(--ink);font-weight:900;font-size:24px}
.band{position:absolute;left:0;right:0;top:90px;height:36px;border-top:3px solid var(--red);border-bottom:3px solid var(--red);pointer-events:none;border-radius:8px}

/* log */
.lg{padding:10px 12px;border-radius:16px;background:#fff0f6;border:2px solid #ffd6e4;margin-bottom:8px;font-size:14px}
.lg .t{font-size:12px;color:var(--muted);margin-bottom:3px}
.lg .k{display:inline-block;font-size:12px;font-weight:900;color:#fff;border-radius:99px;padding:1px 9px;margin-right:6px}
.lg .k.add{background:var(--green)} .lg .k.del{background:var(--red)}
.lg details{margin-top:4px;color:#6b5560}
.lg summary{cursor:pointer;color:var(--blue);font-size:13px}
.lg ul{margin:6px 0 0;padding-left:20px;line-height:1.6}

/* reminder toast */
.toast{position:fixed;left:50%;top:12px;transform:translateX(-50%);width:calc(100% - 24px);max-width:460px;z-index:100;
  background:#fffafc;border:3.5px dashed #ff8fb5;border-radius:22px;padding:14px 16px;box-shadow:0 12px 34px rgba(120,30,70,.3);display:flex;gap:12px;align-items:flex-start}
.toast b{display:block;margin-bottom:3px;color:#e0306f}
</style>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<body>
<div class="app">
  <span class="deco d1">⭐</span><span class="deco d2">💗</span><span class="deco d3">✨</span><span class="deco d4">⭐</span>
  <header>
    <h1 aria-label="運動進度紀錄表"><span style="--c:#ff4f8b">運</span><span style="--c:#2aa3f5">動</span><span style="--c:#2fbf4a">進</span><span style="--c:#ffa51f">度</span><span style="--c:#ff4f8b">紀</span><span style="--c:#2aa3f5">錄</span><span style="--c:#2fbf4a">表</span></h1>
    <button class="btn orange sm" id="logBtn">操作紀錄</button>
  </header>

  <div class="monthbar">
    <button class="btn light" id="prev" aria-label="上個月">◀</button>
    <div class="ym" id="ym"></div>
    <button class="btn light" id="next" aria-label="下個月">▶</button>
  </div>
  <div class="hint">快速點擊兩下年月，可用滾輪跳到指定年月</div>

  <div class="cal">
    <div class="wk"><div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div></div>
    <div class="grid" id="grid"></div>
  </div>

  <div class="actions">
    <button class="btn gray" id="delBtn">刪除事件</button>
    <button class="btn red" id="addBtn">快速新增</button>
  </div>
  <div class="notifybar" id="notifybar"></div>
</div>

<script>
(function(){
  var K_EV='ex_events_v1', K_LOG='ex_log_v1', K_FIRED='ex_fired_v1';
  var WD=['日','一','二','三','四','五','六'];

  /* ---------- storage ---------- */
  function load(k,def){ try{ var v=localStorage.getItem(k); return v?JSON.parse(v):def; }catch(e){ return def; } }
  function save(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
  var events=load(K_EV,{});          // { 'YYYY-MM-DD': [{id,name,status(0/1/2),note}] }
  var logs=load(K_LOG,[]);           // append-only
  var fired=load(K_FIRED,{});

  /* ---------- date utils ---------- */
  function pad(n){ return n<10?'0'+n:''+n; }
  function ds(y,m,d){ return y+'-'+pad(m+1)+'-'+pad(d); }
  function dsOf(dt){ return ds(dt.getFullYear(),dt.getMonth(),dt.getDate()); }
  function parse(s){ var p=s.split('-'); return new Date(+p[0],+p[1]-1,+p[2]); }
  function todayStr(){ return dsOf(new Date()); }
  function nice(s){ var d=parse(s); return d.getFullYear()+'/'+pad(d.getMonth()+1)+'/'+pad(d.getDate())+'（'+WD[d.getDay()]+'）'; }
  function nowStamp(){ var n=new Date(); return n.getFullYear()+'/'+pad(n.getMonth()+1)+'/'+pad(n.getDate())+' '+pad(n.getHours())+':'+pad(n.getMinutes())+':'+pad(n.getSeconds()); }
  function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
  function esc(s){ return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }

  /* status: stored 0 empty,1 done,2 partial. displayed 3 (❌) when day passed and not 1/2 */
  function disp(date,ev){ if(ev.status===1||ev.status===2) return ev.status; return date<todayStr()?3:0; }
  function isPast(date){ return date<todayStr(); }

  /* ---------- logging (append only) ---------- */
  function addLog(type,text,details){
    logs.push({t:nowStamp(),type:type,text:text,details:details||[]});
    save(K_LOG,logs);
  }

  /* ---------- modal helper ---------- */
  function showModal(html,opts){
    opts=opts||{};
    var ov=document.createElement('div'); ov.className='overlay';
    ov.innerHTML='<div class="modal">'+html+'</div>';
    document.body.appendChild(ov);
    function close(){ if(ov.parentNode) ov.parentNode.removeChild(ov); if(opts.onClose) opts.onClose(); }
    if(!opts.noBackdrop) ov.addEventListener('mousedown',function(e){ if(e.target===ov) close(); });
    ov.querySelectorAll('[data-close]').forEach(function(b){ b.addEventListener('click',close); });
    return {el:ov.firstChild,ov:ov,close:close};
  }

  /* ---------- calendar ---------- */
  var now=new Date(), cy=now.getFullYear(), cm=now.getMonth();
  var $grid=document.getElementById('grid'), $ym=document.getElementById('ym');

  function renderCal(){
    $ym.textContent=cy+'年'+(cm+1)+'月';
    var first=new Date(cy,cm,1).getDay(), days=new Date(cy,cm+1,0).getDate(), t=todayStr(), h='';
    for(var i=0;i<first;i++) h+='<div class="cell empty"></div>';
    for(var d=1;d<=days;d++){
      var s=ds(cy,cm,d), list=events[s]||[], cls='cell'+(s===t?' today':'')+(s<t?' past':'');
      var dots='';
      list.slice(0,6).forEach(function(ev){
        var st=disp(s,ev);
        dots+='<span class="dot s'+st+'">'+(st===3?'❌':'')+'</span>';
      });
      if(list.length>6) dots+='<span class="more">+'+(list.length-6)+'</span>';
      h+='<div class="'+cls+'" data-d="'+s+'"><span class="n">'+d+'</span><div class="dots">'+dots+'</div></div>';
    }
    $grid.innerHTML=h;
  }
  $grid.addEventListener('click',function(e){
    var c=e.target.closest('.cell'); if(!c||c.classList.contains('empty')) return;
    openDay(c.getAttribute('data-d'));
  });
  function shift(n){ cm+=n; if(cm<0){cm=11;cy--;} if(cm>11){cm=0;cy++;} renderCal(); }
  document.getElementById('prev').onclick=function(){shift(-1);};
  document.getElementById('next').onclick=function(){shift(1);};

  /* double-click / double-tap on title -> wheel picker */
  var lastTap=0;
  $ym.addEventListener('click',function(){
    var n=Date.now(); if(n-lastTap<400){ lastTap=0; openWheel(); } else lastTap=n;
  });

  function openWheel(){
    var Y0=1990,Y1=2100,H=36, yh='',mh='';
    for(var y=Y0;y<=Y1;y++) yh+='<div data-v="'+y+'">'+y+' 年</div>';
    for(var m=1;m<=12;m++) mh+='<div data-v="'+m+'">'+m+' 月</div>';
    var M=showModal('<div class="mh"><h2>選擇年月</h2></div><div class="mb"><div class="wheels"><div class="wheel" id="wy">'+yh+'</div><div class="wheel" id="wm">'+mh+'</div><div class="band"></div></div><div class="sub" style="margin-top:8px;text-align:center">上下滑動滾輪，停在紅線內即為選取</div></div><div class="mf"><button class="btn light sm" data-close>取消</button><button class="btn red sm" id="wok">前往</button></div>');
    var wy=M.el.querySelector('#wy'), wm=M.el.querySelector('#wm');
    function idx(w){ return Math.round(w.scrollTop/H); }
    function mark(w){ var i=idx(w); w.querySelectorAll('div').forEach(function(d,k){ d.classList.toggle('sel',k===i); }); }
    wy.scrollTop=(cy-Y0)*H; wm.scrollTop=cm*H; mark(wy); mark(wm);
    [wy,wm].forEach(function(w){
      w.addEventListener('scroll',function(){ mark(w); });
      w.addEventListener('click',function(e){ var d=e.target.closest('div[data-v]'); if(d&&d.parentNode===w){ w.scrollTo({top:Array.prototype.indexOf.call(w.children,d)*H,behavior:'smooth'}); } });
    });
    M.el.querySelector('#wok').onclick=function(){
      cy=Y0+Math.max(0,Math.min(Y1-Y0,idx(wy))); cm=Math.max(0,Math.min(11,idx(wm)));
      M.close(); renderCal();
    };
  }

  /* ---------- day modal ---------- */
  function openDay(s){
    var past=isPast(s), M;
    function body(){
      var list=events[s]||[], h='';
      h+='<div class="legend"><span><i></i>未標記</span><span><i style="background:#2ecc71;border-color:#1ea455"></i>已完成</span><span><i style="background:#f6c62b;border-color:#c99b0a"></i>未完全完成</span><span><i style="border-color:#e5252a;color:#e5252a">✕</i>逾期未完成</span></div>';
      if(!list.length) h+='<div class="sub" style="padding:18px 0;text-align:center">這天還沒有運動計劃<br>可用「快速新增」建立</div>';
      list.forEach(function(ev){
        var st=disp(s,ev);
        h+='<div class="ev" data-id="'+ev.id+'"><button class="box s'+st+(past?' locked':'')+'" data-box="'+ev.id+'" '+(past?'disabled':'')+'>'+(st===3?'❌':'')+'</button><div class="evmain"><div class="evname">'+esc(ev.name)+'</div>';
        if(st===2){
          if(past) h+='<div class="notetxt">實際完成：'+esc(ev.note||'（未填寫）')+'</div>';
          else h+='<input class="note" data-note="'+ev.id+'" type="text" placeholder="實際完成內容為何？" value="'+esc(ev.note||'')+'">';
        }
        h+='</div></div>';
      });
      return h;
    }
    var tagHtml=past?'<span class="tag lock">已過・唯讀</span>':(s===todayStr()?'<span class="tag">今天</span>':'');
    M=showModal('<div class="mh"><h2>'+nice(s)+tagHtml+'</h2></div><div class="mb"><div class="sub" style="margin-bottom:4px">當日運動計劃</div><div id="dl"></div></div><div class="mf"><button class="btn light sm" data-close>關閉</button></div>',{onClose:renderCal});
    var dl=M.el.querySelector('#dl');
    function paint(focusId){
      dl.innerHTML=body();
      if(focusId){ var inp=dl.querySelector('[data-note="'+focusId+'"]'); if(inp) inp.focus(); }
    }
    paint();
    dl.addEventListener('click',function(e){
      var b=e.target.closest('[data-box]'); if(!b||past) return;
      var id=b.getAttribute('data-box'), ev=(events[s]||[]).filter(function(x){return x.id===id;})[0]; if(!ev) return;
      ev.status=(ev.status+1)%3;
      if(ev.status!==2) ev.note= ev.status===0?'':ev.note;
      save(K_EV,events); paint(ev.status===2?id:null); renderCal();
    });
    dl.addEventListener('input',function(e){
      var i=e.target.closest('[data-note]'); if(!i) return;
      var id=i.getAttribute('data-note'), ev=(events[s]||[]).filter(function(x){return x.id===id;})[0];
      if(ev){ ev.note=i.value; save(K_EV,events); }
    });
  }

  /* ---------- quick add ---------- */
  var RULES=[
    {k:'odd',label:'固定奇數日期'},{k:'even',label:'固定偶數日期'},
    {k:'wodd',label:'星期幾固定奇數'},{k:'weven',label:'星期幾固定偶數'},
    {k:'workday',label:'僅平日'},{k:'weekend',label:'僅假日'}
  ];
  function matches(dt,sel,wd){
    var d=dt.getDate(), w=dt.getDay();
    if(sel.odd && d%2===1) return true;
    if(sel.even && d%2===0) return true;
    if(sel.wodd && wd[w] && d%2===1) return true;
    if(sel.weven && wd[w] && d%2===0) return true;
    if(sel.workday && w>=1 && w<=5) return true;
    if(sel.weekend && (w===0||w===6)) return true;
    return false;
  }
  function computeDates(start,end,sel,wd){
    var out=[], a=parse(start), b=parse(end), t=parse(todayStr());
    if(a<t) a=t;
    var cnt=0;
    for(var d=new Date(a); d<=b && cnt<400; d.setDate(d.getDate()+1),cnt++){
      if(matches(d,sel,wd)) out.push(dsOf(d));
    }
    return out;
  }

  function openAdd(){
    var sel={}, wd={}, t0=new Date(), e0=new Date(); e0.setDate(e0.getDate()+89);
    var startV=dsOf(t0), endV=dsOf(e0), pm=t0.getMonth(), py=t0.getFullYear();
    var html='<div class="mh"><h2>快速新增</h2></div><div class="mb">'+
      '<label class="f">訓練項目</label><input type="text" id="qn" placeholder="例如：慢跑 5 公里" maxlength="40">'+
      '<label class="f">新增週期（可複選）</label><div class="chips2" id="qr">'+
      RULES.map(function(r){return '<button type="button" class="btn light xs chip" data-r="'+r.k+'">'+r.label+'</button>';}).join('')+'</div>'+
      '<div id="wdbox" style="display:none"><label class="f">選擇星期幾（可複選）</label><div class="chips" id="qw">'+
      WD.map(function(w,i){return '<button type="button" class="btn light xs chip" data-w="'+i+'">'+w+'</button>';}).join('')+'</div></div>'+
      '<label class="f">起訖日期</label><div class="row2"><div><small>開始日期</small><input type="date" id="qs" value="'+startV+'"></div><div><small>結束日期</small><input type="date" id="qe" value="'+endV+'"></div></div>'+
      '<div class="sub" style="margin-top:6px">已過去的日期不會新增；「假日」指週六、週日。</div>'+
      '<div id="pvbox"></div><div class="err" id="qerr"></div></div>'+
      '<div class="mf"><button class="btn light sm" data-close>取消</button><button class="btn red sm" id="qok">確認新增</button></div>';
    var M=showModal(html,{noBackdrop:true}), el=M.el;
    var $pv=el.querySelector('#pvbox'), $err=el.querySelector('#qerr');

    function anySel(){ return Object.keys(sel).some(function(k){return sel[k];}); }
    function wdNeeded(){ return sel.wodd||sel.weven; }
    function hits(){ return computeDates(startV,endV,sel,wd); }

    function paintPv(){
      el.querySelector('#wdbox').style.display=wdNeeded()?'block':'none';
      if(!anySel()){ $pv.innerHTML=''; return; }
      var hs={}, list=hits(); list.forEach(function(x){hs[x]=1;});
      var first=new Date(py,pm,1).getDay(), days=new Date(py,pm+1,0).getDate(), t=todayStr();
      var g=WD.map(function(w){return '<div class="h">'+w+'</div>';}).join('');
      for(var i=0;i<first;i++) g+='<div class="d x"></div>';
      for(var d=1;d<=days;d++){ var s=ds(py,pm,d); g+='<div class="d'+(hs[s]?' hit':'')+(s<t?' off':'')+'">'+d+'</div>'; }
      $pv.innerHTML='<div class="pv"><div class="pvh"><button type="button" class="btn light xs" id="pp">◀</button><span>預覽日曆　'+py+'年'+(pm+1)+'月</span><button type="button" class="btn light xs" id="pn">▶</button></div><div class="pvg">'+g+'</div><div class="sub" style="margin-top:8px;text-align:center">紅色＝將新增的日期，共 <b style="color:#e5252a">'+list.length+'</b> 天</div></div>';
      $pv.querySelector('#pp').onclick=function(){ pm--; if(pm<0){pm=11;py--;} paintPv(); };
      $pv.querySelector('#pn').onclick=function(){ pm++; if(pm>11){pm=0;py++;} paintPv(); };
    }

    el.querySelector('#qr').addEventListener('click',function(e){
      var b=e.target.closest('[data-r]'); if(!b) return;
      var k=b.getAttribute('data-r'); sel[k]=!sel[k]; b.classList.toggle('on',sel[k]); paintPv();
    });
    el.querySelector('#qw').addEventListener('click',function(e){
      var b=e.target.closest('[data-w]'); if(!b) return;
      var k=b.getAttribute('data-w'); wd[k]=!wd[k]; b.classList.toggle('on',wd[k]); paintPv();
    });
    el.querySelector('#qs').addEventListener('change',function(e){
      if(e.target.value){ startV=e.target.value; var d=parse(startV); py=d.getFullYear(); pm=d.getMonth(); paintPv(); }
    });
    el.querySelector('#qe').addEventListener('change',function(e){ if(e.target.value){ endV=e.target.value; paintPv(); } });

    el.querySelector('#qok').onclick=function(){
      var name=el.querySelector('#qn').value.trim();
      if(!name){ $err.textContent='請輸入訓練項目'; return; }
      if(!anySel()){ $err.textContent='請至少勾選一種新增週期'; return; }
      if(wdNeeded() && !Object.keys(wd).some(function(k){return wd[k];})){ $err.textContent='請選擇星期幾'; return; }
      if(endV<startV){ $err.textContent='結束日期不可早於開始日期'; return; }
      var list=hits();
      if(!list.length){ $err.textContent='依此條件沒有符合的日期（已過去的日期不會新增）'; return; }
      var added=[], skipped=0;
      list.forEach(function(s){
        events[s]=events[s]||[];
        if(events[s].some(function(x){return x.name===name;})){ skipped++; return; }
        events[s].push({id:uid(),name:name,status:0,note:''});
        added.push(s);
      });
      save(K_EV,events);
      var rl=RULES.filter(function(r){return sel[r.k];}).map(function(r){return r.label;});
      var wl=wdNeeded()?'（星期'+WD.map(function(w,i){return wd[i]?w:'';}).join('')+'）':'';
      addLog('add','新增事件「'+name+'」，週期：'+rl.join('、')+wl+'；範圍 '+startV+' ～ '+endV+'；共新增 '+added.length+' 天'+(skipped?'（略過同名重複 '+skipped+' 天）':''),added.map(nice));
      M.close(); renderCal();
    };
  }

  /* ---------- delete ---------- */
  function openDel(){
    var t=todayStr(), dates=Object.keys(events).filter(function(s){return s>=t && events[s].length;}).sort();
    if(!dates.length){
      showModal('<div class="mh"><h2>刪除事件</h2></div><div class="mb"><div class="sub" style="padding:24px 0;text-align:center">目前沒有可刪除的事件<br>（已過去的日期不可更動）</div></div><div class="mf"><button class="btn light sm" data-close>關閉</button></div>');
      return;
    }
    var h='';
    dates.forEach(function(s){
      h+='<div class="dg">'+nice(s)+'</div>';
      events[s].forEach(function(ev){
        h+='<label class="di"><input type="checkbox" data-s="'+s+'" data-id="'+ev.id+'"><span>'+esc(ev.name)+'</span><span class="st">'+(ev.status===1?'已完成':ev.status===2?'未完全':'')+'</span></label>';
      });
    });
    var M=showModal('<div class="mh"><h2>刪除事件</h2></div><div class="mb"><div class="sub">可跨日期勾選多筆（僅今日起的事件）</div><div id="dlist">'+h+'</div><div id="cf" style="display:none;margin-top:14px;padding:12px;border-radius:12px;background:#fff1f1;color:#a6121a;font-weight:700"></div></div><div class="mf" id="mf"></div>');
    var el=M.el, boxes=function(){return Array.prototype.slice.call(el.querySelectorAll('input[type=checkbox]'));};
    var mf=el.querySelector('#mf'), cf=el.querySelector('#cf');
    function checked(){ return boxes().filter(function(b){return b.checked;}); }
    function footMain(){
      var n=checked().length;
      cf.style.display='none';
      mf.innerHTML='<button class="btn light sm" data-close>取消</button><button class="btn light sm" id="all">全選</button><button class="btn gray sm" id="go" '+(n?'':'disabled')+'>刪除所選'+(n?'（'+n+'）':'')+'</button>';
      mf.querySelector('[data-close]').onclick=M.close;
      mf.querySelector('#all').onclick=function(){ var all=boxes().every(function(b){return b.checked;}); boxes().forEach(function(b){b.checked=!all;}); footMain(); };
      mf.querySelector('#go').onclick=footConfirm;
    }
    function footConfirm(){
      var n=checked().length; if(!n) return;
      cf.style.display='block'; cf.textContent='確定要刪除 '+n+' 筆事件嗎？刪除後無法復原（操作紀錄會保留）。';
      mf.innerHTML='<button class="btn light sm" id="back">返回</button><button class="btn red sm" id="yes">確定刪除</button>';
      mf.querySelector('#back').onclick=footMain;
      mf.querySelector('#yes').onclick=function(){
        var det=[];
        checked().forEach(function(b){
          var s=b.getAttribute('data-s'), id=b.getAttribute('data-id');
          var ev=(events[s]||[]).filter(function(x){return x.id===id;})[0]; if(!ev) return;
          events[s]=events[s].filter(function(x){return x.id!==id;});
          if(!events[s].length) delete events[s];
          det.push(nice(s)+'「'+ev.name+'」');
        });
        save(K_EV,events);
        addLog('del','刪除 '+det.length+' 筆事件',det);
        M.close(); renderCal();
      };
    }
    el.querySelector('#dlist').addEventListener('change',footMain);
    footMain();
  }

  /* ---------- operation log ---------- */
  function openLog(){
    var h='';
    if(!logs.length) h='<div class="sub" style="padding:24px 0;text-align:center">目前尚無操作紀錄</div>';
    logs.slice().reverse().forEach(function(l){
      h+='<div class="lg"><div class="t">'+esc(l.t)+'</div><span class="k '+l.type+'">'+(l.type==='add'?'新增':'刪除')+'</span>'+esc(l.text);
      if(l.details&&l.details.length) h+='<details><summary>查看明細（'+l.details.length+' 筆）</summary><ul>'+l.details.map(function(d){return '<li>'+esc(d)+'</li>';}).join('')+'</ul></details>';
      h+='</div>';
    });
    showModal('<div class="mh"><h2>操作紀錄</h2></div><div class="mb"><div class="sub" style="margin-bottom:10px">🔒 紀錄只增不減，無法修改或刪除（最新在最上方）</div>'+h+'</div><div class="mf"><button class="btn light sm" data-close>關閉</button></div>');
  }

  /* ---------- reminders (12:00 & 20:00) ---------- */
  function showToast(title,msg){
    var old=document.getElementById('toast'); if(old) old.remove();
    var t=document.createElement('div'); t.className='toast'; t.id='toast';
    t.innerHTML='<div style="flex:1"><b>'+esc(title)+'</b>'+esc(msg)+'</div><button class="btn red xs" id="tx">知道了</button>';
    document.body.appendChild(t); t.querySelector('#tx').onclick=function(){t.remove();};
  }
  function checkReminder(){
    var n=new Date(), t=dsOf(n), mins=n.getHours()*60+n.getMinutes();
    var list=(events[t]||[]).filter(function(ev){return ev.status!==1;});
    var slots=[{k:'12',m:720},{k:'20',m:1200}], due=slots.filter(function(s){return mins>=s.m;});
    if(!due.length) return;
    var key=t, f=fired[key]||{}, need=due.some(function(s){return !f[s.k];});
    if(!need) return;
    due.forEach(function(s){f[s.k]=1;}); fired[key]=f;
    // keep only recent keys
    Object.keys(fired).forEach(function(k){ if(k<t) delete fired[k]; });
    save(K_FIRED,fired);
    if(!list.length) return;
    var msg='你還沒有完成今日訓練內容！尚餘：'+list.map(function(e){return e.name;}).join('、');
    showToast('⏰ 運動提醒',msg);
    try{ if('Notification' in window && Notification.permission==='granted') new Notification('運動進度紀錄表',{body:msg}); }catch(e){}
  }
  function notifyBar(){
    var bar=document.getElementById('notifybar'); bar.innerHTML='';
    try{
      if('Notification' in window && Notification.permission==='default'){
        bar.innerHTML='<button class="btn light xs" id="nb">🔔 開啟系統通知</button><div class="sub" style="margin-top:6px">頁面開著時，12:00 與 20:00 會跳出提醒</div>';
        bar.querySelector('#nb').onclick=function(){ try{ Notification.requestPermission().then(notifyBar); }catch(e){} };
      } else bar.innerHTML='<div class="sub">頁面開著時，12:00 與 20:00 會跳出未完成提醒</div>';
    }catch(e){}
  }

  /* ---------- init ---------- */
  document.getElementById('logBtn').onclick=openLog;
  document.getElementById('delBtn').onclick=openDel;
  document.getElementById('addBtn').onclick=openAdd;
  renderCal(); notifyBar(); checkReminder();
  var lastDay=todayStr();
  setInterval(function(){
    checkReminder();
    if(todayStr()!==lastDay){ lastDay=todayStr(); renderCal(); } // midnight: pending items become ❌
  },20000);
  document.addEventListener('visibilitychange',function(){ if(!document.hidden){ renderCal(); checkReminder(); } });
})();
</script>
<script>if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}</script>
</body>
